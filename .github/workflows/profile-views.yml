name: Profile views counter

on:
  push:
    branches: [main]
    paths-ignore:
      - 'views.json'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-views
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment view count
        run: node .github/scripts/update-views.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- views.json; then
            echo "No changes to commit"
          else
            git add views.json
            git commit -m "chore: bump profile views [skip ci]"
            git push
          fi
